{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}sign in{% endblock %} · brainspread</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="{% static 'knowledge/icons/favicon.ico' %}"
    />
    <style>
      /* Self-contained brutalist palette matching the editor's default
         dark/green look, like the reminder action page: these pages are
         shown before the app (and its theme preference) loads. */
      :root {
        --bg: #000000;
        --fg: #00ff00;
        --muted: #888888;
        --border: #00ff00;
        --danger: #ff3333;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        font-family:
          "SF Mono", "Monaco", "Inconsolata", "Roboto Mono", "Source Code Pro",
          monospace;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      main {
        width: 100%;
        max-width: 32rem;
        border: 3px solid var(--border);
        background: var(--bg);
        padding: 2rem;
        box-shadow: 6px 6px 0 var(--border);
      }

      .brand {
        font-size: 0.8rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 1.25rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: bold;
        letter-spacing: 0.5px;
      }

      p { margin: 0 0 1.25rem; }

      .muted { color: var(--muted); font-size: 0.9rem; }

      .error { color: var(--danger); }

      label {
        display: block;
        margin: 0 0 0.35rem;
        font-size: 0.9rem;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        margin: 0 0 1rem;
        padding: 0.55rem 0.65rem;
        border: 3px solid var(--border);
        border-radius: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: inherit;
        font-size: 1rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .btn {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border: 3px solid var(--border);
        border-radius: 0;
        background: var(--bg);
        color: var(--fg);
        text-decoration: none;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: bold;
        letter-spacing: 0.5px;
        box-shadow: 4px 4px 0 var(--border);
        cursor: pointer;
      }

      .btn-primary {
        background: var(--fg);
        color: var(--bg);
      }

      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--border);
      }

      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--border);
      }

      .link-btn {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        color: var(--muted);
        font-family: inherit;
        font-size: 0.85rem;
        text-decoration: underline;
        cursor: pointer;
      }

      .warning {
        border: 3px solid var(--danger);
        color: var(--danger);
        padding: 0.6rem 0.75rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">brainspread</p>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
